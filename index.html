<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カサ・セグーラ1104ダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
    background-image: url('casa_segura.png');  /* アップロードしたファイル名に合わせる */
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    min-height: 100vh;
    padding: 20px;
    position: relative;
}

/* 背景を少し暗くして、カードを見やすくする */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);  /* 暗さ調整（0.4 = 40%暗く） */
    z-index: -1;
}

.container {
    position: relative;
    z-index: 1;
}
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
h1 {
    color: white;
    text-align: center;
    margin-bottom: 10px;
    font-size: 2.5em;
    text-shadow: 3px 3px 8px rgba(0,0,0,0.8);  /* 影を濃くして見やすく */
    background: rgba(0, 0, 0, 0.3);  /* 背景を少し暗く */
    padding: 15px;
    border-radius: 10px;
}
        
        .last-update {
            color: rgba(255,255,255,0.9);
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;  /* 元に戻す */
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

/* 現在値カード専用（小さいサイズ） */
        .card.compact {
            padding: 20px;
            max-width: 280px;
        }        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;  /* 元に戻す */
            font-size: 1.3em;     /* 元に戻す */
            display: flex;
            align-items: center;
            gap: 10px;
        }

/* 現在値カード専用（小さい見出し） */
        .card.compact h2 {
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .metric:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            color: #666;
            font-size: 1em;
        }
        
        .metric-value {
            font-weight: bold;
            color: #333;
            font-size: 1.8em;  /* 元に戻す */
        }

/* 現在値カード専用（小さいフォント） */
        .card.compact .metric-value {
            font-size: 1.5em;
        }
        
        .metric-value.temp {
            color: #ff6b6b;
        }
        
        .metric-value.humidity {
            color: #4ecdc4;
        }
        
        .chart-card {
            grid-column: 1 / -1;
        }
        
        .chart-container {
            position: relative;
            height: 350px;
            margin-top: 20px;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            margin-top: 50px;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
                /* フィルター */
        .filter-section {
            margin-bottom: 20px;
        }
        
        .filter-section:last-child {
            margin-bottom: 0;
        }
        
        .filter-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .filter-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 6px;
            cursor: pointer;
        }
        
        .checkbox-label span {
            font-size: 0.95em;
            color: #333;
        }
        
        .checkbox-label:hover span {
            color: #667eea;
        }


        

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .metric-value {
                font-size: 1.5em;
            }
            
            .chart-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 カサ・セグーラ1104ダッシュボード</h1>
        <div class="last-update" id="lastUpdate">読み込み中...</div>
        
        <div id="loading" class="loading">データ読み込み中...</div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="dashboard" class="dashboard" style="display: none;">
            <!-- 室内 -->
        <div class="card compact">
                <h2>🏠 室内</h2>
                <div class="metric">
                    <span class="metric-label">温度</span>
                    <span class="metric-value temp" id="indoor-temp">--</span>
                </div>
                <div class="metric">
                    <span class="metric-label">湿度</span>
                    <span class="metric-value humidity" id="indoor-humidity">--</span>
                </div>
            </div>
            
            <!-- 屋外 -->
            <div class="card compact">
                <h2>🌤️ 屋外（ベランダ）</h2>
                <div class="metric">
                    <span class="metric-label">温度</span>
                    <span class="metric-value temp" id="outdoor-temp">--</span>
                </div>
                <div class="metric">
                    <span class="metric-label">湿度</span>
                    <span class="metric-value humidity" id="outdoor-humidity">--</span>
                </div>
            </div>

            <!-- フィルター -->
            <div class="card" style="grid-column: 1 / -1;">
                <h2>📅 表示設定</h2>
                
                <div class="filter-section">
                    <div class="filter-label">表示する日:</div>
                    <div class="filter-checkboxes" id="dateFilters">
                        <!-- JavaScriptで動的に生成 -->
                    </div>
                </div>
                
                <div class="filter-section">
                    <div class="filter-label">表示する場所:</div>
                    <div class="filter-checkboxes">
                        <label class="checkbox-label">
                            <input type="checkbox" id="filterIndoor" checked>
                            <span>室内</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="filterOutdoor" checked>
                            <span>屋外</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- 温度グラフ -->
            <div class="card chart-card">
                <h2>🌡️ おんど</h2>
                <div class="chart-container">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>
            
            <!-- 湿度グラフ -->
            <div class="card chart-card">
                <h2>💧 しつど</h2>
                <div class="chart-container">
                    <canvas id="humidityChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
