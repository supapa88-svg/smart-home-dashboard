<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カサ・セグーラ1104ダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
            background: linear-gradient(135deg, #56CCF2 0%, #2F80ED 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .last-update {
            color: rgba(255,255,255,0.9);
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;  /* 元に戻す */
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

/* 現在値カード専用（小さいサイズ） */
        .card.compact {
            padding: 20px;
            max-width: 280px;
        }        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;  /* 元に戻す */
            font-size: 1.3em;     /* 元に戻す */
            display: flex;
            align-items: center;
            gap: 10px;
        }

/* 現在値カード専用（小さい見出し） */
        .card.compact h2 {
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .metric:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            color: #666;
            font-size: 1em;
        }
        
        .metric-value {
            font-weight: bold;
            color: #333;
            font-size: 1.8em;  /* 元に戻す */
        }

/* 現在値カード専用（小さいフォント） */
        .card.compact .metric-value {
            font-size: 1.5em;
        }
        
        .metric-value.temp {
            color: #ff6b6b;
        }
        
        .metric-value.humidity {
            color: #4ecdc4;
        }
        
        .chart-card {
            grid-column: 1 / -1;
        }
        
        .chart-container {
            position: relative;
            height: 350px;
            margin-top: 20px;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            margin-top: 50px;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .metric-value {
                font-size: 1.5em;
            }
            
            .chart-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 カサ・セグーラ1104ダッシュボード</h1>
        <div class="last-update" id="lastUpdate">読み込み中...</div>
        
        <div id="loading" class="loading">データ読み込み中...</div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="dashboard" class="dashboard" style="display: none;">
            <!-- 室内 -->
        <div class="card compact">
                <h2>🏠 室内</h2>
                <div class="metric">
                    <span class="metric-label">温度</span>
                    <span class="metric-value temp" id="indoor-temp">--</span>
                </div>
                <div class="metric">
                    <span class="metric-label">湿度</span>
                    <span class="metric-value humidity" id="indoor-humidity">--</span>
                </div>
            </div>
            
            <!-- 屋外 -->
            <div class="card compact">
                <h2>🌤️ 屋外（ベランダ）</h2>
                <div class="metric">
                    <span class="metric-label">温度</span>
                    <span class="metric-value temp" id="outdoor-temp">--</span>
                </div>
                <div class="metric">
                    <span class="metric-label">湿度</span>
                    <span class="metric-value humidity" id="outdoor-humidity">--</span>
                </div>
            </div>
            
            <!-- 温度グラフ -->
            <div class="card chart-card">
                <h2>🌡️ 温度推移（24時間）</h2>
                <div class="chart-container">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>
            
            <!-- 湿度グラフ -->
            <div class="card chart-card">
                <h2>💧 湿度推移（24時間）</h2>
                <div class="chart-container">
                    <canvas id="humidityChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
